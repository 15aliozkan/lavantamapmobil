function updateGhostLandmark(worldPt) {
    const type = state.placingLandmarkType;
    if (!type) return;
    const meta = LANDMARK_META[type];
    const sz = meta.sizes[state.selectedLandmarkVariant] || meta.sizes[0];
    let angle = state.ghostLandmark ? state.ghostLandmark.manualOffset : 0;

    let bestDist = 85;
    for (const r of state.roads) {
        for (let i = 0; i < r.points.length - 1; i++) {
            const info = distToSegmentInfo(worldPt, r.points[i], r.points[i + 1]);
            if (info.distance < bestDist) {
                bestDist = info.distance;
                const roadAngle = Math.atan2(r.points[i + 1].y - r.points[i].y, r.points[i + 1].x - r.points[i].x);
                angle = roadAngle + (state.ghostLandmark ? state.ghostLandmark.manualOffset : 0);
            }
        }
    }

    state.ghostLandmark = {
        type,
        variant: state.selectedLandmarkVariant,
        x: worldPt.x,
        y: worldPt.y,
        w: sz.w,
        d: sz.d,
        angle,
        manualOffset: state.ghostLandmark ? state.ghostLandmark.manualOffset : 0
    };
}

function confirmPlaceLandmark() {
    if (!state.ghostLandmark) return;
    if (state.ghostLandmark.type !== 'harbor' && isPointInWater(state.ghostLandmark)) {
        showToast('Özel yapılar ada üzerine yerleştirilmelidir.');
        return;
    }
    saveSnapshot();
    state.landmarks.push({ ...state.ghostLandmark });
    updateStatsUI();
    showToast(`${LANDMARK_META[state.ghostLandmark.type].title} eklendi!`);
}

function paintTreesAt(center, radius, density, isSingle = false) {
    if (isSingle) {
        if (isPointInWater(center)) return;
        state.trees.push({
            x: center.x, y: center.y,
            size: 7 + Math.random() * 5,
            type: state.selectedTreeType === 'mixed' ? ['pine', 'broadleaf', 'palm'][Math.floor(Math.random() * 3)] : state.selectedTreeType,
            shade: Math.floor(Math.random() * 4)
        });
        return;
    }
    const count = Math.max(1, Math.floor((radius / 18) * density));
    for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = Math.sqrt(Math.random()) * radius;
        const pt = { x: center.x + Math.cos(a) * r, y: center.y + Math.sin(a) * r };
        if (isPointInWater(pt)) continue;
        const onRoad = state.roads.some(rd => rd.points.some((rp, idx) => idx % 2 === 0 && dist(rp, pt) < 16));
        if (!onRoad) {
            state.trees.push({
                x: pt.x, y: pt.y,
                size: 5 + Math.random() * 5,
                type: state.selectedTreeType === 'mixed' ? ['pine', 'broadleaf', 'palm'][Math.floor(Math.random() * 3)] : state.selectedTreeType,
                shade: Math.floor(Math.random() * 4)
            });
        }
    }
}

function applySmoothBrushStroke(newPt, applyFn, spacing) {
    state.brushTrail.push(newPt);
    const len = state.brushTrail.length;
    if (len === 1) {
        applyFn(newPt);
        return;
    }
    const p1 = state.brushTrail[len - 2];
    const p2 = state.brushTrail[len - 1];
    const p0 = len >= 3 ? state.brushTrail[len - 3] : p1;
    const steps = Math.max(1, Math.ceil(dist(p1, p2) / Math.max(2, spacing)));
    for (let s = 1; s <= steps; s++) {
        const t = s / steps;
        const pt = len >= 3 ? catmullRomPoint(p0, p1, p2, p2, t) : {
            x: p1.x + (p2.x - p1.x) * t,
            y: p1.y + (p2.y - p1.y) * t
        };
        applyFn(pt);
    }
}

function applyElevationBrush(wPos) {
    if (state.tool === 'elev_raise') {
        state.elevStamps.push({ x: wPos.x, y: wPos.y, radius: state.elevBrushRadius, height: 2.2 });
    } else if (state.tool === 'elev_lower') {
        state.elevStamps.forEach(st => {
            if (dist(st, wPos) < state.elevBrushRadius * 0.75) st.height -= 2.2;
        });
        state.elevStamps = state.elevStamps.filter(st => st.height > 0.5);
    } else if (state.tool === 'elev_flatten') {
        state.elevStamps = state.elevStamps.filter(st => dist(st, wPos) > state.elevBrushRadius * 0.75);
    }
}

function eraseAt(worldPt, radius) {
    state.trees = state.trees.filter(t => dist(t, worldPt) > radius);
    state.buildings = state.buildings.filter(b => dist(b, worldPt) > radius);
    state.landmarks = state.landmarks.filter(lm => dist(lm, worldPt) > radius);
    state.zones = state.zones.filter(z => dist(z, worldPt) > radius);
    state.zonePolygons = state.zonePolygons.filter(zp => !pointInPolygon(worldPt, zp.points) && !zp.points.some(p => dist(p, worldPt) < radius));

    const prevRoadCount = state.roads.length;
    state.roads = state.roads.filter(r => !r.points.some(p => dist(p, worldPt) < radius));
    if (state.roads.length !== prevRoadCount) {
        rebuildRoadJunctions();
        syncTrafficVehicles(true);
    }

    state.lakes = state.lakes.filter(l => dist(l.center, worldPt) > radius);
    state.rivers = state.rivers.filter(rv => !rv.points.some(p => dist(p, worldPt) < radius));
    updateStatsUI();
}

// ============================================================================
// ÇOKGEN BÖLGE (POLYGON ZONING)
// ============================================================================
function findZoneSnapVertex(worldPt, threshold = 22) {
    let best = null;
    if (state.zonePolyPoints.length >= 3) {
        const startPt = state.zonePolyPoints[0];
        if (dist(worldPt, startPt) < threshold * 1.25) {
            return { x: startPt.x, y: startPt.y, isCloseStart: true };
        }
    }
    for (const zp of state.zonePolygons) {
        for (const v of zp.points) {
            const d = dist(worldPt, v);
            if (d < threshold && (!best || d < best.distance)) {
                best = { x: v.x, y: v.y, distance: d, isCloseStart: false };
            }
        }
    }
    return best;
}

function finalizeZonePolygon() {
    if (state.zonePolyPoints.length < 3) {
        state.zonePolyPoints = [];
        return;
    }
    saveSnapshot();
    const newPoly = {
        id: 'zpoly_' + Date.now(),
        type: state.selectedZoneType,
        points: state.zonePolyPoints.slice()
    };

    const sameTypeTouching = [];
    state.zonePolygons.forEach((existing, idx) => {
        if (existing.type === newPoly.type && polygonsOverlapOrTouch(newPoly.points, existing.points)) {
            sameTypeTouching.push(idx);
        }
    });

    if (sameTypeTouching.length > 0) {
        const toMerge = sameTypeTouching.map(i => state.zonePolygons[i].points);
        toMerge.push(newPoly.points);
        const merged = mergeOverlappingPolygonsGrid(toMerge, 12);
        const keep = state.zonePolygons.filter((_, idx) => !sameTypeTouching.includes(idx));
        if (merged) keep.push({ id: 'zpoly_' + Date.now(), type: newPoly.type, points: merged });
        state.zonePolygons = keep;
        showToast('Bölge komşu bölgeyle birleştirildi!');
    } else {
        state.zonePolygons.push(newPoly);
        showToast('Çokgen bölge oluşturuldu.');
    }

    state.zonePolyPoints = [];
    state.zoneSnapVertex = null;
    updateFinishZoneButton();
    updateStatsUI();
}

// ============================================================================
// 2.5D İZOMETRİK RENDER MOTORU (SAHNE, KÖPRÜLER, KARANLIK MOD PENCERELERİ & PNG)
// ============================================================================
function drawWorldPolygon(targetCtx, points, wz, cam, w, h, opts = {}) {
    if (!points || points.length < 3) return;
    targetCtx.beginPath();
    for (let i = 0; i < points.length; i++) {
        const s = worldToScreen(points[i].x, points[i].y, wz, cam, w, h);
        if (i === 0) targetCtx.moveTo(s.x, s.y);
        else targetCtx.lineTo(s.x, s.y);
    }
    targetCtx.closePath();
    if (opts.fill) {
        targetCtx.fillStyle = opts.fill;
        targetCtx.fill();
    }
    if (opts.stroke) {
        targetCtx.strokeStyle = opts.stroke;
        targetCtx.lineWidth = opts.lineWidth || 1;
        targetCtx.lineJoin = opts.lineJoin || 'round';
        targetCtx.stroke();
    }
}

function draw3DBox(targetCtx, x, y, wz, wBox, dBox, hBox, angle, cam, w, h, colors, drawWindows = false) {
    const hw = wBox * 0.5;
    const hd = dBox * 0.5;
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);

    const localCorners = [
        { lx: -hw, ly: -hd },
        { lx: hw, ly: -hd },
        { lx: hw, ly: hd },
        { lx: -hw, ly: hd }
    ];

    const worldCorners = localCorners.map(c => ({
        x: x + c.lx * cos - c.ly * sin,
        y: y + c.lx * sin + c.ly * cos
    }));

    const baseScreen = worldCorners.map(c => worldToScreen(c.x, c.y, wz, cam, w, h));
    const topScreen = worldCorners.map(c => worldToScreen(c.x, c.y, wz + hBox, cam, w, h));

    if (!cam.is3D) {
        targetCtx.beginPath();
        baseScreen.forEach((p, i) => i === 0 ? targetCtx.moveTo(p.x, p.y) : targetCtx.lineTo(p.x, p.y));
        targetCtx.closePath();
        targetCtx.fillStyle = colors.top;
        targetCtx.fill();
        if (colors.stroke) {
            targetCtx.strokeStyle = colors.stroke;
            targetCtx.lineWidth = Math.max(0.8, 1.1 * cam.zoom);
            targetCtx.stroke();
        }
        return;
    }

    // Kameraya bakan ön yüzeyleri belirle ve çiz
    const faces = [];
    for (let i = 0; i < 4; i++) {
        const j = (i + 1) % 4;
        const avgY = (baseScreen[i].y + baseScreen[j].y) * 0.5;
        faces.push({ i, j, avgY });
    }
    faces.sort((a, b) => a.avgY - b.avgY);

    const visibleFaces = faces.slice(2);
    visibleFaces.forEach((f, idx) => {
        const b1 = baseScreen[f.i], b2 = baseScreen[f.j];
        const t1 = topScreen[f.i], t2 = topScreen[f.j];

        targetCtx.beginPath();
        targetCtx.moveTo(b1.x, b1.y);
        targetCtx.lineTo(b2.x, b2.y);
        targetCtx.lineTo(t2.x, t2.y);
        targetCtx.lineTo(t1.x, t1.y);
        targetCtx.closePath();
        targetCtx.fillStyle = idx === 0 ? colors.left : colors.right;
        targetCtx.fill();
        if (colors.stroke) {
            targetCtx.strokeStyle = colors.stroke;
            targetCtx.lineWidth = Math.max(0.6, 0.9 * cam.zoom);
            targetCtx.stroke();
        }

        // Karanlık modda sıcak pencere ışıkları
        if (drawWindows && state.theme === 'dark' && cam.zoom > 0.35 && hBox > 7) {
            const edgeLen = Math.hypot(b2.x - b1.x, b2.y - b1.y);
            const wallH = Math.hypot(t1.x - b1.x, t1.y - b1.y);
            const cols = Math.max(1, Math.floor(edgeLen / (7 * cam.zoom)));
            const rows = Math.max(1, Math.floor(wallH / (7.5 * cam.zoom)));

            for (let r = 0; r < rows; r++) {
                const vRatio = (r + 0.5) / rows;
                for (let c = 0; c < cols; c++) {
                    const hash = Math.sin((x * 13.7 + y * 7.3 + r * 31 + c * 17 + idx * 5)) * 43758.5453;
                    const frac = hash - Math.floor(hash);
                    if (frac < 0.42) continue;

                    const uRatio = (c + 0.5) / cols;
                    const wx = (b1.x + (b2.x - b1.x) * uRatio) * (1 - vRatio) + (t1.x + (t2.x - t1.x) * uRatio) * vRatio;
                    const wy = (b1.y + (b2.y - b1.y) * uRatio) * (1 - vRatio) + (t1.y + (t2.y - t1.y) * uRatio) * vRatio;

                    targetCtx.fillStyle = frac > 0.82 ? 'rgba(255, 243, 196, 0.92)' : 'rgba(253, 186, 116, 0.85)';
                    const pw = Math.max(1.5, 2.4 * cam.zoom);
                    const ph = Math.max(1.5, 2.6 * cam.zoom);
                    targetCtx.fillRect(wx - pw * 0.5, wy - ph * 0.5, pw, ph);
                }
            }
        }
    });

    // Çatı (Üst Yüzey)
    targetCtx.beginPath();
    topScreen.forEach((p, i) => i === 0 ? targetCtx.moveTo(p.x, p.y) : targetCtx.lineTo(p.x, p.y));
    targetCtx.closePath();
    targetCtx.fillStyle = colors.top;
    targetCtx.fill();
    if (colors.stroke) {
        targetCtx.strokeStyle = colors.stroke;
        targetCtx.lineWidth = Math.max(0.7, 1.0 * cam.zoom);
        targetCtx.stroke();
    }
}

function drawLandmark(targetCtx, lm, theme, cam, w, h, isGhost = false) {
    targetCtx.save();
    if (isGhost) targetCtx.globalAlpha = 0.68;
    const elev = getTerrainElevationAt(lm.x, lm.y);

    if (lm.type === 'cityhall') {
        const c = { top: theme.bldgTop, left: theme.bldgLeft, right: theme.bldgRight, stroke: theme.bldgStroke };
        const cos = Math.cos(lm.angle), sin = Math.sin(lm.angle);
        const placePart = (lx, ly, pw, pd, ph) => {
            draw3DBox(targetCtx, lm.x + lx * cos - ly * sin, lm.y + lx * sin + ly * cos, elev, pw, pd, ph, lm.angle, cam, w, h, c, true);
        };
        if (lm.variant === 0) {
            // U Şekli
            placePart(0, -lm.d * 0.32, lm.w, lm.d * 0.34, 24);
            placePart(-lm.w * 0.36, lm.d * 0.08, lm.w * 0.28, lm.d * 0.68, 20);
            placePart(lm.w * 0.36, lm.d * 0.08, lm.w * 0.28, lm.d * 0.68, 20);
        } else if (lm.variant === 1) {
            // L Şekli
            placePart(-lm.w * 0.15, -lm.d * 0.3, lm.w * 0.7, lm.d * 0.36, 24);
            placePart(-lm.w * 0.32, lm.d * 0.12, lm.w * 0.36, lm.d * 0.65, 22);
        } else {
            // I Blok
            placePart(0, 0, lm.w, lm.d, 26);
        }
    } else if (lm.type === 'stadium') {
        if (lm.variant === 1) {
            // Kare Stadyum
            draw3DBox(targetCtx, lm.x, lm.y, elev, lm.w, lm.d, 22, lm.angle, cam, w, h, {
                top: '#cbd5e1', left: '#94a3b8', right: '#64748b', stroke: theme.bldgStroke
            }, true);
            draw3DBox(targetCtx, lm.x, lm.y, elev + 12, lm.w * 0.66, lm.d * 0.66, 11, lm.angle, cam, w, h, {
                top: '#22c55e', left: '#16a34a', right: '#15803d', stroke: '#ffffff'
            }, false);
        } else {
            // Yuvarlak / Oval Stadyum
            const sc = worldToScreen(lm.x, lm.y, elev + 8, cam, w, h);
            const tiltFactor = cam.is3D ? cam.tilt : 1.0;
            targetCtx.save();
            targetCtx.translate(sc.x, sc.y);
            targetCtx.rotate(lm.angle + cam.rotation);
            targetCtx.scale(1, tiltFactor);

            targetCtx.beginPath();
            targetCtx.ellipse(0, 0, lm.w * 0.5 * cam.zoom, lm.d * 0.5 * cam.zoom, 0, 0, Math.PI * 2);
            targetCtx.fillStyle = state.theme === 'dark' ? '#475569' : '#e2e8f0';
            targetCtx.fill();
            targetCtx.lineWidth = 3 * cam.zoom;
            targetCtx.strokeStyle = '#94a3b8';
            targetCtx.stroke();

            targetCtx.beginPath();
            targetCtx.ellipse(0, 0, lm.w * 0.33 * cam.zoom, lm.d * 0.33 * cam.zoom, 0, 0, Math.PI * 2);
            targetCtx.fillStyle = '#22c55e';
            targetCtx.fill();
            targetCtx.strokeStyle = '#ffffff';
            targetCtx.lineWidth = 1.5 * cam.zoom;
            targetCtx.stroke();
            targetCtx.restore();
        }
    } else if (lm.type === 'square') {
        // 3 Farklı Boyutlu Kent Meydanı
        draw3DBox(targetCtx, lm.x, lm.y, elev, lm.w, lm.d, 1.5, lm.angle, cam, w, h, {
            top: state.theme === 'dark' ? '#3f3b36' : '#ebe2ce',
            left: '#c8bea8',
            right: '#b8ae98',
            stroke: '#a89f8c'
        }, false);
        const sc = worldToScreen(lm.x, lm.y, elev + 3, cam, w, h);
        targetCtx.beginPath();
        targetCtx.arc(sc.x, sc.y, Math.min(lm.w, lm.d) * 0.16 * cam.zoom, 0, Math.PI * 2);
        targetCtx.fillStyle = '#38bdf8';
        targetCtx.fill();
    } else {
        const pal = lm.type === 'hospital'
            ? { top: '#f8fafc', left: '#e2e8f0', right: '#cbd5e1', stroke: '#ef4444' }
            : lm.type === 'airport'
            ? { top: '#475569', left: '#334155', right: '#1e293b', stroke: '#f8fafc' }
            : { top: '#d6ccc2', left: '#b0a69c', right: '#8d837a', stroke: theme.bldgStroke };
        const hBox = lm.type === 'airport' ? 3 : lm.type === 'harbor' ? 4 : 26;
        draw3DBox(targetCtx, lm.x, lm.y, elev, lm.w, lm.d, hBox, lm.angle, cam, w, h, pal, lm.type === 'hospital');
    }
    targetCtx.restore();
}

function drawRoadPath(targetCtx, points, elevOffset, cam, w, h, strokeStyle, lineWidth, dash = []) {
    if (!points || points.length < 2) return;
    targetCtx.save();
    targetCtx.beginPath();
    for (let i = 0; i < points.length; i++) {
        const elev = getTerrainElevationAt(points[i].x, points[i].y) + elevOffset;
        const s = worldToScreen(points[i].x, points[i].y, elev, cam, w, h);
        if (i === 0) targetCtx.moveTo(s.x, s.y);
        else targetCtx.lineTo(s.x, s.y);
    }
    targetCtx.strokeStyle = strokeStyle;
    targetCtx.lineWidth = lineWidth;
    targetCtx.lineCap = 'round';
    targetCtx.lineJoin = 'round';
    targetCtx.setLineDash(dash);
    targetCtx.stroke();
    targetCtx.restore();
}

function renderRoadsAndRails(targetCtx, theme, cam, w, h) {
    const roadSpecs = {
        highway: { casingW: 26 * cam.zoom, fillW: 21 * cam.zoom, casing: theme.highwayCasing, fill: theme.highwayFill },
        main: { casingW: 17 * cam.zoom, fillW: 13 * cam.zoom, casing: theme.mainCasing, fill: theme.mainFill },
        street: { casingW: 11 * cam.zoom, fillW: 8 * cam.zoom, casing: theme.streetCasing, fill: theme.streetFill }
    };

    const drivable = state.roads.filter(r => r.type !== 'railway');

    // 1. Su Üstündeki Köprü Ayakları ve Tabliyesi
    for (const r of drivable) {
        for (let i = 0; i < r.points.length - 1; i++) {
            const p1 = r.points[i], p2 = r.points[i + 1];
            const mid = { x: (p1.x + p2.x) * 0.5, y: (p1.y + p2.y) * 0.5 };
            if (isPointInWater(mid)) {
                const s1 = worldToScreen(p1.x, p1.y, 7.5, cam, w, h);
                const s2 = worldToScreen(p2.x, p2.y, 7.5, cam, w, h);
                if (cam.is3D && i % 2 === 0) {
                    const sWater = worldToScreen(mid.x, mid.y, 0, cam, w, h);
                    const sDeck = worldToScreen(mid.x, mid.y, 7.5, cam, w, h);
                    targetCtx.beginPath();
                    targetCtx.moveTo(sWater.x, sWater.y);
                    targetCtx.lineTo(sDeck.x, sDeck.y);
                    targetCtx.strokeStyle = theme.bridgePier;
                    targetCtx.lineWidth = 4 * cam.zoom;
                    targetCtx.stroke();
                }
                const bw = (r.type === 'highway' ? 30 : 20) * cam.zoom;
                targetCtx.beginPath();
                targetCtx.moveTo(s1.x, s1.y);
                targetCtx.lineTo(s2.x, s2.y);
                targetCtx.strokeStyle = theme.bridgeRail;
                targetCtx.lineWidth = bw;
                targetCtx.lineCap = 'butt';
                targetCtx.stroke();
            }
        }
    }

    // 2. Dış Kenarlık (Casing) - Tüm yollarda kesintisiz birleşim sağlar
    for (const r of drivable) {
        const spec = roadSpecs[r.type] || roadSpecs.street;
        drawRoadPath(targetCtx, r.points, 0.6, cam, w, h, spec.casing, spec.casingW);
    }

    // 3. İç Asfalt Dolgu (Fill) - Dairesiz doğrudan kavşak kaynaşması
    for (const r of drivable) {
        const spec = roadSpecs[r.type] || roadSpecs.street;
        drawRoadPath(targetCtx, r.points, 0.7, cam, w, h, spec.fill, spec.fillW);
    }

    // 4. Otoyol Orta Refüjü (Kavşak noktalarında kesintiye uğrar)
    for (const r of drivable) {
        if (r.type !== 'highway') continue;
        for (let i = 0; i < r.points.length - 1; i++) {
            const p1 = r.points[i], p2 = r.points[i + 1];
            const mid = { x: (p1.x + p2.x) * 0.5, y: (p1.y + p2.y) * 0.5 };
            const nearJunction = state.junctions.some(jc => dist(jc, mid) < 26);
            if (nearJunction) continue;

            const e1 = getTerrainElevationAt(p1.x, p1.y) + 0.8;
            const e2 = getTerrainElevationAt(p2.x, p2.y) + 0.8;
            const s1 = worldToScreen(p1.x, p1.y, e1, cam, w, h);
            const s2 = worldToScreen(p2.x, p2.y, e2, cam, w, h);
            targetCtx.beginPath();
            targetCtx.moveTo(s1.x, s1.y);
            targetCtx.lineTo(s2.x, s2.y);
            targetCtx.strokeStyle = theme.highwayMedian;
            targetCtx.lineWidth = Math.max(1.8, 3.4 * cam.zoom);
            targetCtx.lineCap = 'round';
            targetCtx.stroke();
        }
    }

    // 5. Minimal Tek Çizgi Tren Yolu ve Kısa Travers Tahtaları
    const railways = state.roads.filter(r => r.type === 'railway');
    for (const rail of railways) {
        // Kısa dik ahşap traversler
        for (let i = 0; i < rail.points.length - 1; i++) {
            const p1 = rail.points[i], p2 = rail.points[i + 1];
            const segLen = dist(p1, p2);
            const steps = Math.max(1, Math.floor(segLen / 10));
            const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
            const nx = -Math.sin(angle) * 4.5;
            const ny = Math.cos(angle) * 4.5;

            for (let s = 0; s < steps; s++) {
                const t = s / steps;
                const wx = p1.x + (p2.x - p1.x) * t;
                const wy = p1.y + (p2.y - p1.y) * t;
                const elev = getTerrainElevationAt(wx, wy) + 0.6;
                const a = worldToScreen(wx - nx, wy - ny, elev, cam, w, h);
                const b = worldToScreen(wx + nx, wy + ny, elev, cam, w, h);
                targetCtx.beginPath();
                targetCtx.moveTo(a.x, a.y);
                targetCtx.lineTo(b.x, b.y);
                targetCtx.strokeStyle = theme.railTie;
                targetCtx.lineWidth = Math.max(1.2, 2.2 * cam.zoom);
                targetCtx.stroke();
            }
        }
        // Tek ince çelik ray çizgisi
        drawRoadPath(targetCtx, rail.points, 0.75, cam, w, h, theme.railSteel, Math.max(1.5, 2.4 * cam.zoom));
    }
}

function render3DEntities(targetCtx, theme, cam, w, h) {
    const renderQueue = [];

    for (const b of state.buildings) {
        const sc = worldToScreen(b.x, b.y, 0, cam, w, h);
        renderQueue.push({ depth: sc.y, kind: 'building', data: b });
    }
    for (const t of state.trees) {
        const sc = worldToScreen(t.x, t.y, 0, cam, w, h);
        renderQueue.push({ depth: sc.y, kind: 'tree', data: t });
    }
    for (const lm of state.landmarks) {
        const sc = worldToScreen(lm.x, lm.y, 0, cam, w, h);
        renderQueue.push({ depth: sc.y, kind: 'landmark', data: lm });
    }

    renderQueue.sort((a, b) => a.depth - b.depth);

    for (const item of renderQueue) {
        if (item.kind === 'building') {
            const b = item.data;
            const elev = getTerrainElevationAt(b.x, b.y);
            draw3DBox(targetCtx, b.x, b.y, elev, b.w, b.d, b.height, b.angle, cam, w, h, {
                top: theme.bldgTop,
                left: theme.bldgLeft,
                right: theme.bldgRight,
                stroke: theme.bldgStroke
            }, true);
        } else if (item.kind === 'tree') {
            const t = item.data;
            const elev = getTerrainElevationAt(t.x, t.y);
            const sc = worldToScreen(t.x, t.y, elev + 3, cam, w, h);
            const r = t.size * cam.zoom;
            targetCtx.beginPath();
            targetCtx.arc(sc.x, sc.y, Math.max(2, r), 0, Math.PI * 2);
            targetCtx.fillStyle = theme.treeColors[t.shade % theme.treeColors.length];
            targetCtx.fill();
        } else if (item.kind === 'landmark') {
            drawLandmark(targetCtx, item.data, theme, cam, w, h, false);
        }
    }

    // Minimal Otonom Araçlar
    if (state.trafficEnabled) {
        for (const v of state.vehicles) {
            const road = state.roads.find(r => r.id === v.roadId);
            if (!road || road.points.length < 2) continue;
            const idx = Math.max(0, Math.min(road.points.length - 2, v.segIdx));
            const p1 = road.points[idx], p2 = road.points[idx + 1];
            const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
            const laneOffset = (road.type === 'highway' ? 6.5 : 3.5) * v.dir;
            const nx = -Math.sin(angle) * laneOffset;
            const ny = Math.cos(angle) * laneOffset;
            const wx = p1.x + (p2.x - p1.x) * v.t + nx;
            const wy = p1.y + (p2.y - p1.y) * v.t + ny;
            const elev = getTerrainElevationAt(wx, wy) + 0.9;

            draw3DBox(targetCtx, wx, wy, elev, 7.5, 4.2, 3.2, angle, cam, w, h, {
                top: v.color,
                left: v.color,
                right: '#334155',
                stroke: 'rgba(0,0,0,0.35)'
            }, false);
        }
    }
}

function renderScene(targetCtx = ctx, cam = state.camera, w = canvas.width, h = canvas.height, includeOverlays = true) {
    const theme = THEMES[state.theme] || THEMES.light;

    // 1. Deniz Arka Planı & Izgara
    targetCtx.fillStyle = theme.water;
    targetCtx.fillRect(0, 0, w, h);

    // 2. Adalar (Kıyı Kumu + Ana Kara + Merkez km² Etiketi)
    for (const isl of state.islands) {
        drawWorldPolygon(targetCtx, isl.points, 0.2, cam, w, h, {
            fill: theme.landBase,
            stroke: theme.sand,
            lineWidth: Math.max(4, 10 * cam.zoom)
        });
        drawWorldPolygon(targetCtx, isl.points, 0.4, cam, w, h, {
            fill: theme.landBase,
            stroke: theme.landStroke,
            lineWidth: Math.max(1, 1.5 * cam.zoom)
        });
    }

    // 3. Yükselti İzohips Katmanları
    const tiltFactor = cam.is3D ? cam.tilt : 1.0;
    for (const st of state.elevStamps) {
        const layers = Math.min(5, Math.max(1, Math.ceil(st.height / 5)));
        for (let l = 0; l < layers; l++) {
            const ratio = 1 - (l / (layers + 0.5));
            const sc = worldToScreen(st.x, st.y, l * 2.5, cam, w, h);
            targetCtx.beginPath();
            targetCtx.ellipse(sc.x, sc.y, st.radius * ratio * cam.zoom, st.radius * ratio * cam.zoom * tiltFactor, 0, 0, Math.PI * 2);
            targetCtx.fillStyle = theme.elevPalette[l % theme.elevPalette.length];
            targetCtx.fill();
        }
    }

    // 4. İmar Bölgeleri (Çokgen + Fırça)
    for (const zp of state.zonePolygons) {
        const c = getPolygonCentroid(zp.points);
        const elev = getTerrainElevationAt(c.x, c.y);
        drawWorldPolygon(targetCtx, zp.points, elev + 0.35, cam, w, h, {
            fill: theme.zones[zp.type] || theme.zones.park,
            stroke: 'rgba(0, 122, 255, 0.45)',
            lineWidth: 1.5 * cam.zoom
        });
    }
    for (const z of state.zones) {
        const elev = getTerrainElevationAt(z.x, z.y);
        const sc = worldToScreen(z.x, z.y, elev + 0.35, cam, w, h);
        targetCtx.beginPath();
        targetCtx.ellipse(sc.x, sc.y, z.radius * cam.zoom, z.radius * cam.zoom * tiltFactor, 0, 0, Math.PI * 2);
        targetCtx.fillStyle = theme.zones[z.type] || theme.zones.park;
        targetCtx.fill();
    }

    // 5. Göller ve Nehirler
    for (const lake of state.lakes) {
        drawWorldPolygon(targetCtx, lake.points, 0.5, cam, w, h, {
            fill: theme.lakeFill,
            stroke: theme.lakeStroke,
            lineWidth: Math.max(1.5, 2.5 * cam.zoom)
        });
    }
    for (const rv of state.rivers) {
        drawRoadPath(targetCtx, rv.points, 0.45, cam, w, h, theme.riverFill, (rv.width || 16) * cam.zoom);
    }

    // 6. Yollar, Köprüler ve Tren Rayları
    renderRoadsAndRails(targetCtx, theme, cam, w, h);

    // 7. 3D Binalar, Ağaçlar, Özel Yapılar ve Araçlar
    render3DEntities(targetCtx, theme, cam, w, h);

    // 8. Ada Merkezinde km² Etiketleri
    for (const isl of state.islands) {
        if (!isl.points || isl.points.length < 3) continue;
        const c = getPolygonCentroid(isl.points);
        const elev = getTerrainElevationAt(c.x, c.y) + 2;
        const sc = worldToScreen(c.x, c.y, elev, cam, w, h);
        const label = `${isl.name || 'Ada'} • ${isl.areaKm2.toFixed(2)} km²`;

        targetCtx.save();
        targetCtx.font = `700 ${Math.max(10, Math.round(12 * Math.min(1.25, Math.max(0.85, cam.zoom))))}px -apple-system, BlinkMacSystemFont, sans-serif`;
        const metrics = targetCtx.measureText(label);
        const padX = 9, boxH = 22;
        const bx = sc.x - metrics.width * 0.5 - padX;
        const by = sc.y - boxH * 0.5;

        targetCtx.fillStyle = state.theme === 'dark' ? 'rgba(28, 28, 32, 0.78)' : 'rgba(255, 255, 255, 0.82)';
        targetCtx.beginPath();
        targetCtx.roundRect(bx, by, metrics.width + padX * 2, boxH, 11);
        targetCtx.fill();

        targetCtx.fillStyle = state.theme === 'dark' ? '#f2f2f7' : '#1c1c1e';
        targetCtx.textAlign = 'center';
        targetCtx.textBaseline = 'middle';
        targetCtx.fillText(label, sc.x, sc.y);
        targetCtx.restore();
    }

    if (!includeOverlays) return;

    // 9. Aktif Çizim Önizlemeleri (Ada, Göl, Yol, Çokgen Bölge, Hayalet Özel Yapı)
    if ((state.tool === 'draw_island' || state.tool === 'draw_lake') && state.freehandStroke.length > 1) {
        const isLake = state.tool === 'draw_lake';
        drawWorldPolygon(targetCtx, state.freehandStroke, 2.5, cam, w, h, {
            fill: isLake ? 'rgba(56, 189, 248, 0.35)' : 'rgba(0, 122, 255, 0.25)',
            stroke: isLake ? '#0284c7' : '#007aff',
            lineWidth: 2.5
        });
    }

    if ((state.tool === 'draw_road' || state.tool === 'draw_river') && state.controlPoints.length > 0) {
        const targetPt = state.snapTarget ? { x: state.snapTarget.x, y: state.snapTarget.y } : state.mouseWorldPos;
        const previewCtrl = [...state.controlPoints, targetPt];
        const previewPts = generateSplinePoints(previewCtrl, state.curveMode);
        const pColor = state.tool === 'draw_river' ? '#0284c7' :
                       state.selectedRoadType === 'highway' ? '#f59e0b' :
                       state.selectedRoadType === 'railway' ? '#64748b' : '#007aff';
        drawRoadPath(targetCtx, previewPts, 1.5, cam, w, h, pColor, 6 * cam.zoom, [8, 6]);

        for (const cp of state.controlPoints) {
            const sp = worldToScreen(cp.x, cp.y, 2, cam, w, h);
            targetCtx.beginPath();
            targetCtx.arc(sp.x, sp.y, 5, 0, Math.PI * 2);
            targetCtx.fillStyle = pColor;
            targetCtx.fill();
        }
    }

    if (state.snapTarget) {
        const sp = worldToScreen(state.snapTarget.x, state.snapTarget.y, 2, cam, w, h);
        targetCtx.beginPath();
        targetCtx.arc(sp.x, sp.y, 8, 0, Math.PI * 2);
        targetCtx.strokeStyle = '#34c759';
        targetCtx.lineWidth = 3;
        targetCtx.stroke();
    }

    if (state.tool === 'zone_tool' && state.zoneDrawMode === 'polygon' && state.zonePolyPoints.length > 0) {
        const targetPt = state.zoneSnapVertex ? { x: state.zoneSnapVertex.x, y: state.zoneSnapVertex.y } : state.mouseWorldPos;
        const previewPts = [...state.zonePolyPoints, targetPt];
        if (previewPts.length >= 3) {
            drawWorldPolygon(targetCtx, previewPts, 2.5, cam, w, h, { fill: 'rgba(0, 122, 255, 0.22)' });
        }
        drawRoadPath(targetCtx, previewPts, 2.8, cam, w, h, '#007aff', 2.5, [6, 4]);
    }

    if (state.tool === 'place_landmark' && state.ghostLandmark) {
        drawLandmark(targetCtx, state.ghostLandmark, theme, cam, w, h, true);
    }

    // Fırça İmleci Halkası
    const brushMap = {
        elev_raise: { r: state.elevBrushRadius, c: '#ff9500' },
        elev_lower: { r: state.elevBrushRadius, c: '#af52de' },
        elev_flatten: { r: state.elevBrushRadius, c: '#007aff' },
        brush_forest: { r: state.treeBrushSize, c: '#34c759' },
        eraser: { r: 36, c: '#ff3b30' }
    };
    if (state.tool === 'zone_tool' && state.zoneDrawMode === 'brush') {
        brushMap.zone_tool = { r: state.zoneBrushRadius, c: '#007aff' };
    }
    if (brushMap[state.tool]) {
        const bInfo = brushMap[state.tool];
        const sc = worldToScreen(state.mouseWorldPos.x, state.mouseWorldPos.y, 1, cam, w, h);
        targetCtx.beginPath();
        targetCtx.ellipse(sc.x, sc.y, bInfo.r * cam.zoom, bInfo.r * cam.zoom * tiltFactor, 0, 0, Math.PI * 2);
        targetCtx.strokeStyle = bInfo.c;
        targetCtx.lineWidth = 2;
        targetCtx.stroke();
    }
}

// ============================================================================
// PNG DIŞA AKTARMA (2D TAM HARİTA & MEVCUT 3D AÇI)
// ============================================================================
let selectedExportView = '2d';

function exportMapPNG() {
    const resStr = document.getElementById('selectExportResolution').value;
    const [baseW, baseH] = resStr.split('x').map(Number);
    const qualityMult = parseFloat(document.getElementById('sliderExportQuality').value) || 1.5;

    const outW = Math.round(baseW * qualityMult);
    const outH = Math.round(baseH * qualityMult);

    const offCanvas = document.createElement('canvas');
    offCanvas.width = outW;
    offCanvas.height = outH;
    const offCtx = offCanvas.getContext('2d');

    let exportCam = { ...state.camera };
    if (selectedExportView === '2d') {
        exportCam.is3D = false;
        exportCam.tilt = 1.0;
        exportCam.rotation = 0;

        if (state.islands.length > 0) {
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            for (const isl of state.islands) {
                for (const p of isl.points) {
                    if (p.x < minX) minX = p.x;
                    if (p.x > maxX) maxX = p.x;
                    if (p.y < minY) minY = p.y;
                    if (p.y > maxY) maxY = p.y;
                }
            }
            exportCam.x = (minX + maxX) * 0.5;
            exportCam.y = (minY + maxY) * 0.5;
            const spanX = Math.max(200, (maxX - minX) * 1.22);
            const spanY = Math.max(200, (maxY - minY) * 1.22);
            exportCam.zoom = Math.min(outW / spanX, outH / spanY);
        }
    } else {
        exportCam.zoom = state.camera.zoom * (outW / Math.max(1, canvas.width));
    }

    renderScene(offCtx, exportCam, outW, outH, false);

    const filename = `maps_studio_${selectedExportView}_${baseW}x${baseH}.png`;
    offCanvas.toBlob((blob) => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(url), 4000);
        showToast(`PNG indirildi (${outW}×${outH} px)!`);
    }, 'image/png');
}

// ============================================================================
// FARE, DOKUNMATİK (MULTI-TOUCH PINCH/ROTATE) VE KLAVYE ETKİLEŞİMLERİ
// ============================================================================
const touchGesture = {
    active: false,
    startDist: 0,
    startAngle: 0,
    startZoom: 1,
    startRot: 0,
    startMid: { x: 0, y: 0 },
    startCam: { x: 0, y: 0 }
};

function getPointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    const src = (e.touches && e.touches.length > 0) ? e.touches[0] :
                (e.changedTouches && e.changedTouches.length > 0) ? e.changedTouches[0] : e;
    return { x: (src.clientX - rect.left) * dpr, y: (src.clientY - rect.top) * dpr };
}

function getTouchPairInfo(t1, t2) {
    const rect = canvas.getBoundingClientRect();
    const p1 = { x: (t1.clientX - rect.left) * dpr, y: (t1.clientY - rect.top) * dpr };
    const p2 = { x: (t2.clientX - rect.left) * dpr, y: (t2.clientY - rect.top) * dpr };
    return {
        dist: Math.max(10, Math.hypot(p2.x - p1.x, p2.y - p1.y)),
        angle: Math.atan2(p2.y - p1.y, p2.x - p1.x),
        mid: { x: (p1.x + p2.x) * 0.5, y: (p1.y + p2.y) * 0.5 }
    };
}

function handlePrimaryDown(pos, button = 0) {
    const wPos = screenToWorld(pos.x, pos.y);
    state.mouseWorldPos = wPos;
    state.dragStart = pos;

    if (button === 2) {
        state.pointerMode = 'orbit';
        state.camStart = { x: state.camera.x, y: state.camera.y, rot: state.camera.rotation, tilt: state.camera.tilt };
        return;
    }

    if (state.tool === 'pan' || button === 1 || state.keysPressed[' ']) {
        state.pointerMode = 'pan';
        state.camStart = { x: state.camera.x, y: state.camera.y, rot: state.camera.rotation, tilt: state.camera.tilt };
        return;
    }

    if (state.tool === 'place_landmark') {
        updateGhostLandmark(wPos);
        if (state.ghostLandmark) confirmPlaceLandmark();
        return;
    }

    if (state.tool === 'zone_tool' && state.zoneDrawMode === 'polygon') {
        const snap = findZoneSnapVertex(wPos, 26 / state.camera.zoom);
        if (snap && snap.isCloseStart && state.zonePolyPoints.length >= 3) {
            finalizeZonePolygon();
            return;
        }
        state.zonePolyPoints.push(snap ? { x: snap.x, y: snap.y } : { ...wPos });
        updateFinishZoneButton();
        if (state.zonePolyPoints.length === 1) {
            showToast('Köşelere dokunarak bölge çizin; bitirmek için "Bölgeyi Bitir"e basın.');
        }
        return;
    }

    if ((state.tool === 'draw_road' || state.tool === 'draw_river') && state.curveMode !== 'freehand') {
        const snap = state.tool === 'draw_road' ? findRoadSnapPoint(wPos, 28 / state.camera.zoom) : null;
        const pt = snap ? { x: snap.x, y: snap.y } : { ...wPos };
        if (state.controlPoints.length === 0 || dist(state.controlPoints[state.controlPoints.length - 1], pt) > 6) {
            state.controlPoints.push(pt);
            updateFinishRoadButton();
            if (state.controlPoints.length === 1) {
                showToast('Noktalara dokunarak çizin; bitirmek için "Yolu Bitir"e dokunun.');
            }
        }
        return;
    }

    state.pointerMode = 'tool';
    state.brushTrail = [];
    saveSnapshot();

    if (['draw_island', 'draw_lake'].includes(state.tool) || ((state.tool === 'draw_road' || state.tool === 'draw_river') && state.curveMode === 'freehand')) {
        state.freehandStroke = [wPos];
    } else if (state.tool.startsWith('elev_')) {
        applySmoothBrushStroke(wPos, (pt) => applyElevationBrush(pt), state.elevBrushRadius * 0.14);
    } else if (state.tool === 'brush_forest') {
        applySmoothBrushStroke(wPos, (pt) => paintTreesAt(pt, state.treeBrushSize, 0.65, false), state.treeBrushSize * 0.22);
    } else if (state.tool === 'single_tree') {
        paintTreesAt(wPos, 5, 1, true);
    } else if (state.tool === 'zone_tool' && state.zoneDrawMode === 'brush') {
        applySmoothBrushStroke(wPos, (pt) => {
            state.zones.push({ x: pt.x, y: pt.y, radius: state.zoneBrushRadius, type: state.selectedZoneType });
        }, state.zoneBrushRadius * 0.16);
    } else if (state.tool === 'eraser') {
        applySmoothBrushStroke(wPos, (pt) => eraseAt(pt, 36), 10);
    }
}

function handlePrimaryMove(pos) {
    const wPos = screenToWorld(pos.x, pos.y);
    state.mouseWorldPos = wPos;

    document.getElementById('coordText').textContent =
        `Konum: ${(wPos.x / 1000).toFixed(2)} km, ${(wPos.y / 1000).toFixed(2)} km • Hareket: W A S D`;

    state.snapTarget = state.tool === 'draw_road' ? findRoadSnapPoint(wPos, 24 / state.camera.zoom) : null;
    state.zoneSnapVertex = (state.tool === 'zone_tool' && state.zoneDrawMode === 'polygon') ? findZoneSnapVertex(wPos, 22 / state.camera.zoom) : null;

    if (state.tool === 'place_landmark') updateGhostLandmark(wPos);
    if (!state.pointerMode) return;

    if (state.pointerMode === 'orbit') {
        const dx = pos.x - state.dragStart.x;
        const dy = pos.y - state.dragStart.y;
        state.camera.rotation = state.camStart.rot + dx * 0.0045;
        if (state.camera.is3D) {
            state.camera.tilt = Math.max(0.32, Math.min(0.95, state.camStart.tilt + dy * 0.002));
        }
        syncCameraUI();
    } else if (state.pointerMode === 'pan') {
        const tiltFactor = state.camera.is3D ? state.camera.tilt : 1.0;
        const rx = (pos.x - state.dragStart.x) / state.camera.zoom;
        const ry = (pos.y - state.dragStart.y) / (state.camera.zoom * tiltFactor);
        const cos = Math.cos(-state.camera.rotation);
        const sin = Math.sin(-state.camera.rotation);
        state.camera.x = state.camStart.x - (rx * cos - ry * sin);
        state.camera.y = state.camStart.y - (rx * sin + ry * cos);
    } else if (state.pointerMode === 'tool') {
        if (state.freehandStroke.length > 0) {
            const last = state.freehandStroke[state.freehandStroke.length - 1];
            if (dist(last, wPos) > 10) state.freehandStroke.push(wPos);
        } else if (state.tool.startsWith('elev_')) {
            applySmoothBrushStroke(wPos, (pt) => applyElevationBrush(pt), state.elevBrushRadius * 0.14);
        } else if (state.tool === 'brush_forest') {
            applySmoothBrushStroke(wPos, (pt) => paintTreesAt(pt, state.treeBrushSize, 0.65, false), state.treeBrushSize * 0.22);
        } else if (state.tool === 'zone_tool' && state.zoneDrawMode === 'brush') {
            applySmoothBrushStroke(wPos, (pt) => {
                state.zones.push({ x: pt.x, y: pt.y, radius: state.zoneBrushRadius, type: state.selectedZoneType });
            }, state.zoneBrushRadius * 0.16);
        } else if (state.tool === 'eraser') {
            applySmoothBrushStroke(wPos, (pt) => eraseAt(pt, 36), 10);
        }
    }
}

function handlePrimaryUp() {
    if (state.pointerMode === 'tool') {
        if (state.tool === 'draw_island' && state.freehandStroke.length >= 5) {
            addOrMergeIslandPolygon(smoothPolygon(state.freehandStroke, 2));
            updateStatsUI();
            const totalArea = state.islands.reduce((acc, isl) => acc + isl.areaKm2, 0).toFixed(2);
            showToast(`Ada güncellendi! Toplam kara: ${totalArea} km²`);
        } else if (state.tool === 'draw_lake' && state.freehandStroke.length >= 4) {
            addOrMergeLakePolygon(smoothPolygon(state.freehandStroke, 2));
            updateStatsUI();
            showToast('Göl haritaya eklendi.');
        } else if ((state.tool === 'draw_road' || state.tool === 'draw_river') && state.curveMode === 'freehand' && state.freehandStroke.length >= 2) {
            if (state.tool === 'draw_road') addRoadFromPoints(state.freehandStroke, state.selectedRoadType, false);
            else state.rivers.push({ points: state.freehandStroke.slice(), width: 16 });
            updateStatsUI();
        } else {
            updateStatsUI();
        }
    }
    state.pointerMode = null;
    state.freehandStroke = [];
    state.brushTrail = [];
}

canvas.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    if ((state.tool === 'draw_road' || state.tool === 'draw_river') && state.controlPoints.length >= 2) {
        finalizeActiveRoad();
    } else if (state.tool === 'zone_tool' && state.zoneDrawMode === 'polygon' && state.zonePolyPoints.length >= 3) {
        finalizeZonePolygon();
    }
});

canvas.addEventListener('dblclick', () => {
    if ((state.tool === 'draw_road' || state.tool === 'draw_river') && state.controlPoints.length >= 2) {
        finalizeActiveRoad();
    } else if (state.tool === 'zone_tool' && state.zoneDrawMode === 'polygon' && state.zonePolyPoints.length >= 3) {
        finalizeZonePolygon();
    }
});

canvas.addEventListener('mousedown', (e) => {
    handlePrimaryDown(getPointerPos(e), e.button);
});

window.addEventListener('mousemove', (e) => {
    handlePrimaryMove(getPointerPos(e));
});

window.addEventListener('mouseup', () => {
    handlePrimaryUp();
});

canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.12 : 0.89;
    state.camera.zoom = Math.max(0.18, Math.min(3.5, state.camera.zoom * factor));
    syncCameraUI();
}, { passive: false });

// Mobil Dokunmatik Olayları (1 Parmak Çizim/Gezinme, 2 Parmak Pinch-Zoom & Döndürme)
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (e.touches.length === 2) {
        state.pointerMode = null;
        state.freehandStroke = [];
        const pair = getTouchPairInfo(e.touches[0], e.touches[1]);
        touchGesture.active = true;
        touchGesture.startDist = pair.dist;
        touchGesture.startAngle = pair.angle;
        touchGesture.startZoom = state.camera.zoom;
        touchGesture.startRot = state.camera.rotation;
        touchGesture.startMid = pair.mid;
        touchGesture.startCam = { x: state.camera.x, y: state.camera.y };
        return;
    }
    if (e.touches.length === 1 && !touchGesture.active) {
        handlePrimaryDown(getPointerPos(e), 0);
    }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (e.touches.length === 2 && touchGesture.active) {
        const pair = getTouchPairInfo(e.touches[0], e.touches[1]);
        const scale = pair.dist / touchGesture.startDist;
        state.camera.zoom = Math.max(0.18, Math.min(3.5, touchGesture.startZoom * scale));
        state.camera.rotation = touchGesture.startRot + (pair.angle - touchGesture.startAngle);

        const tiltFactor = state.camera.is3D ? state.camera.tilt : 1.0;
        const rx = (pair.mid.x - touchGesture.startMid.x) / state.camera.zoom;
        const ry = (pair.mid.y - touchGesture.startMid.y) / (state.camera.zoom * tiltFactor);
        const cos = Math.cos(-state.camera.rotation);
        const sin = Math.sin(-state.camera.rotation);
        state.camera.x = touchGesture.startCam.x - (rx * cos - ry * sin);
        state.camera.y = touchGesture.startCam.y - (rx * sin + ry * cos);
        syncCameraUI();
        return;
    }
    if (e.touches.length === 1 && !touchGesture.active) {
        handlePrimaryMove(getPointerPos(e));
    }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    if (touchGesture.active && e.touches.length < 2) {
        touchGesture.active = false;
        return;
    }
    if (e.touches.length === 0) {
        handlePrimaryUp();
    }
}, { passive: false });

window.addEventListener('keydown', (e) => {
    state.keysPressed[e.key.toLowerCase()] = true;
    if ((e.key === 'r' || e.key === 'R') && state.ghostLandmark) {
        state.ghostLandmark.manualOffset += Math.PI / 12;
        updateGhostLandmark(state.mouseWorldPos);
    } else if (e.key === 'Enter' || e.key === 'Escape') {
        if ((state.tool === 'draw_road' || state.tool === 'draw_river') && state.controlPoints.length >= 2) {
            finalizeActiveRoad();
        } else if (state.tool === 'zone_tool' && state.zoneDrawMode === 'polygon' && state.zonePolyPoints.length >= 3) {
            finalizeZonePolygon();
        } else {
            state.controlPoints = [];
            state.zonePolyPoints = [];
            state.ghostLandmark = null;
            updateFinishRoadButton();
            updateFinishZoneButton();
        }
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        if (state.controlPoints.length > 0) {
            state.controlPoints.pop();
            updateFinishRoadButton();
        } else {
            undoLastAction();
        }
    }
});

window.addEventListener('keyup', (e) => {
    delete state.keysPressed[e.key.toLowerCase()];
});

function updateWASDMovement(dt) {
    let moveX = 0, moveY = 0;
    if (state.keysPressed['w'] || state.keysPressed['arrowup']) moveY -= 1;
    if (state.keysPressed['s'] || state.keysPressed['arrowdown']) moveY += 1;
    if (state.keysPressed['a'] || state.keysPressed['arrowleft']) moveX -= 1;
    if (state.keysPressed['d'] || state.keysPressed['arrowright']) moveX += 1;
    if (moveX === 0 && moveY === 0) return;

    const len = Math.hypot(moveX, moveY);
    moveX /= len; moveY /= len;
    const speed = (650 / state.camera.zoom) * dt;
    const cos = Math.cos(-state.camera.rotation);
    const sin = Math.sin(-state.camera.rotation);
    state.camera.x += (moveX * cos - moveY * sin) * speed;
    state.camera.y += (moveX * sin + moveY * cos) * speed;
}

// ============================================================================
// UI BAĞLANTILARI
// ============================================================================
function syncCameraUI() {
    document.getElementById('compassNeedle').style.transform = `rotate(${state.camera.rotation}rad)`;
    const meters = Math.round(120 / state.camera.zoom);
    document.getElementById('scaleLabel').textContent = meters >= 1000 ? `${(meters / 1000).toFixed(1)} km` : `${meters} m`;
}

function applyThemeUI() {
    const isDark = state.theme === 'dark';
    document.body.classList.toggle('dark-mode', isDark);
    document.body.classList.toggle('light-mode', !isDark);
    document.querySelectorAll('[data-acrylic]').forEach(el => {
        el.classList.toggle('acrylic-dark', isDark);
        el.classList.toggle('acrylic-light', !isDark);
    });
    document.getElementById('themeIcon').textContent = isDark ? '🌙' : '☀️';
    document.getElementById('themeText').textContent = isDark ? 'Karanlık' : 'Aydınlık';
}

function setTool(toolName) {
    state.tool = toolName;
    state.controlPoints = [];
    state.zonePolyPoints = [];
    updateFinishRoadButton();
    updateFinishZoneButton();
    if (toolName !== 'place_landmark') {
        state.placingLandmarkType = null;
        state.ghostLandmark = null;
    }
    document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tool === toolName && !btn.dataset.road && !btn.dataset.landmark && !btn.dataset.zone);
    });
    if (toolName === 'draw_road') {
        document.querySelectorAll('.road-type-btn').forEach(b => b.classList.toggle('active', b.dataset.road === state.selectedRoadType));
    }
    if (toolName === 'zone_tool') {
        document.querySelectorAll('.zone-btn').forEach(b => b.classList.toggle('active', b.dataset.zone === state.selectedZoneType));
    }
}

document.getElementById('btnThemeToggle').addEventListener('click', () => {
    state.theme = state.theme === 'light' ? 'dark' : 'light';
    applyThemeUI();
    saveMapToStorage();
});

document.getElementById('btnTiltToggle').addEventListener('click', () => {
    state.camera.is3D = !state.camera.is3D;
    document.getElementById('btnTiltToggle').classList.toggle('active', state.camera.is3D);
    document.getElementById('tiltIcon').textContent = state.camera.is3D ? '🏙️' : '🗺️';
    document.getElementById('tiltText').textContent = state.camera.is3D ? '3D Görünüm' : '2D Kuşbakışı';
});

document.getElementById('btnTrafficToggle').addEventListener('click', () => {
    state.trafficEnabled = !state.trafficEnabled;
    document.getElementById('btnTrafficToggle').classList.toggle('active', state.trafficEnabled);
    document.getElementById('trafficText').textContent = state.trafficEnabled ? 'Trafik Açık' : 'Trafik Kapalı';

document.getElementById('sliderTrafficSpeed').addEventListener('input', (e) => {
    state.trafficSpeed = parseFloat(e.target.value);
    document.getElementById('trafficSpeedLabel').textContent = `${state.trafficSpeed.toFixed(1)}x`;
});

document.getElementById('btnRotateLeft').addEventListener('click', () => { state.camera.rotation -= Math.PI / 8; syncCameraUI(); });
document.getElementById('btnRotateRight').addEventListener('click', () => { state.camera.rotation += Math.PI / 8; syncCameraUI(); });
document.getElementById('btnResetNorth').addEventListener('click', () => { state.camera.rotation = 0; syncCameraUI(); });
document.getElementById('btnZoomIn').addEventListener('click', () => { state.camera.zoom = Math.min(3.5, state.camera.zoom * 1.25); syncCameraUI(); });
document.getElementById('btnZoomOut').addEventListener('click', () => { state.camera.zoom = Math.max(0.18, state.camera.zoom * 0.8); syncCameraUI(); });
document.getElementById('btnUndo').addEventListener('click', undoLastAction);

document.getElementById('btnClearMap').addEventListener('click', () => {
    saveSnapshot();
    state.islands = []; state.elevStamps = []; state.lakes = []; state.rivers = [];
    state.roads = []; state.junctions = []; state.buildings = []; state.landmarks = [];
    state.trees = []; state.zones = []; state.zonePolygons = [];
    state.controlPoints = []; state.zonePolyPoints = []; state.vehicles = [];
    localStorage.removeItem(STORAGE_KEY);
    updateFinishRoadButton();
    updateFinishZoneButton();
    updateStatsUI();
    showToast('Harita tamamen temizlendi.');
});

document.querySelectorAll('.drawer-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        const target = tab.dataset.target;
        const drawer = document.getElementById('toolDrawer');

        if (state.activeDrawerTab === target && state.drawerOpen) {
            state.drawerOpen = false;
            drawer.classList.add('collapsed');
            tab.classList.remove('active');
            return;
        }

        state.activeDrawerTab = target;
        state.drawerOpen = true;
        drawer.classList.remove('collapsed');

        document.querySelectorAll('.drawer-tab').forEach(t => t.classList.toggle('active', t.dataset.target === target));
        document.querySelectorAll('.drawer-panel').forEach(p => {
            p.classList.toggle('hidden', p.dataset.panel !== target);
        });

        if (target === 'terrain') setTool('draw_island');
        else if (target === 'roads') setTool('draw_road');
        else if (target === 'nature') setTool('brush_forest');
        else if (target === 'zoning') setTool('zone_tool');
    });
});

document.querySelectorAll('.tool-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        if (btn.dataset.road) {
            state.selectedRoadType = btn.dataset.road;
            document.querySelectorAll('.road-type-btn').forEach(b => b.classList.toggle('active', b === btn));
            setTool('draw_road');
            return;
        }
        if (btn.dataset.landmark) {
            const lmType = btn.dataset.landmark;
            state.placingLandmarkType = lmType;
            state.selectedLandmarkVariant = 0;
            const meta = LANDMARK_META[lmType];
            document.getElementById('landmarkVariantTitle').textContent = `${meta.title}:`;
            meta.variants.forEach((vLabel, idx) => {
                const vb = document.getElementById(`variantBtn${idx}`);
                vb.textContent = vLabel;
                vb.classList.toggle('active', idx === 0);
            });
            document.querySelectorAll('.landmark-btn').forEach(b => b.classList.toggle('active', b === btn));
            setTool('place_landmark');
            state.placingLandmarkType = lmType;
            updateGhostLandmark(state.mouseWorldPos);
            return;
        }
        if (btn.dataset.zone) {
            state.selectedZoneType = btn.dataset.zone;
            document.querySelectorAll('.zone-btn').forEach(b => b.classList.toggle('active', b === btn));
            setTool('zone_tool');
            return;
        }
        setTool(btn.dataset.tool);
    });
});

document.querySelectorAll('.variant-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        state.selectedLandmarkVariant = parseInt(btn.dataset.variant);
        document.querySelectorAll('.variant-btn').forEach(b => b.classList.toggle('active', b === btn));
        if (state.placingLandmarkType) updateGhostLandmark(state.mouseWorldPos);
    });
});

document.getElementById('btnRotateLandmark').addEventListener('click', () => {
    if (state.ghostLandmark) {
        state.ghostLandmark.manualOffset += Math.PI / 6;
        updateGhostLandmark(state.mouseWorldPos);
    }
});

document.querySelectorAll('.curve-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        state.curveMode = btn.dataset.curve;
        state.controlPoints = [];
        updateFinishRoadButton();
        document.querySelectorAll('.curve-btn').forEach(b => b.classList.toggle('active', b === btn));
    });
});

document.getElementById('btnFinishRoad').addEventListener('click', finalizeActiveRoad);
document.getElementById('btnFinishZonePoly').addEventListener('click', finalizeZonePolygon);

document.getElementById('btnAutoBuildings').addEventListener('click', () => {
    state.autoBuildings = !state.autoBuildings;
    const btn = document.getElementById('btnAutoBuildings');
    btn.classList.toggle('active', state.autoBuildings);
    btn.textContent = state.autoBuildings ? '🏢 Oto-Bina: Açık' : '🏢 Oto-Bina: Kapalı';
});

document.getElementById('sliderBuildingFloors').addEventListener('input', (e) => {
    state.avgFloors = parseInt(e.target.value);
    document.getElementById('buildingFloorsLabel').textContent = `${state.avgFloors} Kat`;
});

document.getElementById('sliderElevRadius').addEventListener('input', (e) => {
    state.elevBrushRadius = parseInt(e.target.value);
    document.getElementById('elevRadiusLabel').textContent = `${state.elevBrushRadius}m`;
});

document.getElementById('sliderTreeBrush').addEventListener('input', (e) => {
    state.treeBrushSize = parseInt(e.target.value);
    document.getElementById('treeBrushLabel').textContent = `${state.treeBrushSize}m`;
});

document.querySelectorAll('.tree-type-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        state.selectedTreeType = btn.dataset.treetype;
        document.querySelectorAll('.tree-type-btn').forEach(b => b.classList.toggle('active', b === btn));
    });
});

document.querySelectorAll('.zone-mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        state.zoneDrawMode = btn.dataset.zonemode;
        state.zonePolyPoints = [];
        updateFinishZoneButton();
        document.querySelectorAll('.zone-mode-btn').forEach(b => b.classList.toggle('active', b === btn));
        document.getElementById('zoneBrushSizeBox').classList.toggle('hidden', state.zoneDrawMode !== 'brush');
    });
});

document.getElementById('sliderZoneRadius').addEventListener('input', (e) => {
    state.zoneBrushRadius = parseInt(e.target.value);
    document.getElementById('zoneRadiusLabel').textContent = `${state.zoneBrushRadius}m`;
});

// PNG Export Modal Kontrolleri
document.getElementById('btnOpenExportModal').addEventListener('click', () => {
    document.getElementById('exportModalBackdrop').classList.add('open');
});
document.getElementById('btnCloseExportModal').addEventListener('click', () => {
    document.getElementById('exportModalBackdrop').classList.remove('open');
});
document.getElementById('btnCancelExport').addEventListener('click', () => {
    document.getElementById('exportModalBackdrop').classList.remove('open');
});
document.querySelectorAll('.export-view-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        selectedExportView = btn.dataset.exportview;
        document.querySelectorAll('.export-view-btn').forEach(b => b.classList.toggle('active', b === btn));
    });
});
document.getElementById('sliderExportQuality').addEventListener('input', (e) => {
    const val = parseFloat(e.target.value);
    document.getElementById('exportQualityLabel').textContent = val === 1 ? '1.0x Standart' : val === 1.5 ? '1.5x Yüksek' : '2.0x Ultra Retina';
});
document.getElementById('btnConfirmExport').addEventListener('click', () => {
    document.getElementById('exportModalBackdrop').classList.remove('open');
    exportMapPNG();
});

// ============================================================================
// ANA ANİMASYON DÖNGÜSÜ
// ============================================================================
let lastFrameTime = performance.now();
function animate(now = performance.now()) {
    const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
    lastFrameTime = now;

    updateWASDMovement(dt);
    updateTrafficVehicles(dt);
    renderScene();

    requestAnimationFrame(animate);
}

window.onload = function () {
    const restored = loadMapFromStorage();
    if (!restored) {
        initDefaultIsland();
    } else {
        applyThemeUI();
        rebuildRoadJunctions();
        syncTrafficVehicles(true);
        updateStatsUI();
    }
    syncCameraUI();
    animate();
};
</script>
</body>
</html>
